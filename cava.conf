[general]
framerate = 30
bars = 8
autosens = 1

[input]
# Read from the ALSA loopback capture device.
# "loopcapture" is defined in /etc/asound.conf as a plug
# wrapping dsnoop on hw:Loopback,1,0 for zero-latency frequency analysis.
method = alsa
source = loopcapture

[output]
# Output raw ASCII data to a FIFO pipe.
# Our Python controller reads this pipe in the cava_reader_thread.
method = raw
data_format = ascii
ascii_max_range = 255
raw_target = /tmp/cava.fifo

[smoothing]
integral = 77
monstercat = 1
gravity = 100
ignore = 0

[eq]
# Slight bass boost for a punchier visualiser
1 = 1.2
2 = 1.1
3 = 1
4 = 1
5 = 1
6 = 1
7 = 1
8 = 1
