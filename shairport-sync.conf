// =====================================================================
// Shairport-Sync Configuration — AirPlay Audio Receiver
// =====================================================================
//
// Audio is sent directly to ALSA default (pcm.airplay_dup -> softvol_master).
// The ALSA kernel multi/route plugin outputs audio directly to hardware
// (Headphones or PCM5102A I2S DAC) while cloning a tap to Loopback for CAVA.
//
// Session hooks write state to /tmp/airplay_state so the Python
// controller can update the status LED and display.
// =====================================================================

general = {
    name = "Sandy's Airplay Device";
    output_backend = "alsa";
    mdns_backend = "avahi";
    // Allow a wide volume range for fine-grained control
    volume_range_db = 60;
};

alsa = {
    // Output to the ALSA loopback playback side.
    // The kernel internally couples this to hw:Loopback,1,0 (capture),
    // which is read by both CAVA and alsaloop.
    output_device = "hw:Loopback,0,0";
    output_rate = 44100;
    output_format = "S16";
    period_size = 1024;
    buffer_size = 8192;
};

metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    // Metadata pipe for TFT album art & track info display
    pipe_name = "/tmp/shairport-sync-metadata";
    pipe_timeout = 5000;
    // Cover art image cache directory for fast instant retrieval
    cover_art_cache_directory = "/tmp/shairport-sync-art";
    // Send periodic progress updates every 1.0s for real-time seek and timeline tracking
    progress_interval = 1.0;
};

// Session hooks — write state to /tmp/airplay_state so the Python controller monitors.
// Placed in /usr/local/bin so the restricted 'shairport-sync' user has full traversal permissions.
sessioncontrol = {
    run_this_before_entering_active_state = "/usr/local/bin/airplay_on_event.sh connected";
    run_this_after_exiting_active_state = "/usr/local/bin/airplay_on_event.sh disconnected";
    run_this_before_play_begins = "/usr/local/bin/airplay_on_event.sh playing";
    run_this_after_play_ends = "/usr/local/bin/airplay_on_event.sh connected";
    active_state_timeout = 10;
};
