// =====================================================================
// Shairport-Sync Configuration — AirPlay Audio Receiver
// =====================================================================
//
// Audio is sent to the ALSA Loopback device (hw:Loopback,0,0).
// From there, alsaloop relays it through softvol to the real DAC,
// while CAVA taps the loopback capture side for frequency analysis.
//
// Session hooks write state to /tmp/airplay_state so the Python
// controller can update the status LED.
// =====================================================================

general = {
    name = "PiAudioReceiver";
    output_backend = "alsa";
    mdns_backend = "avahi";
    // Allow a wide volume range for fine-grained control
    volume_range_db = 60;
};

alsa = {
    // Output to the ALSA loopback playback side.
    // The kernel internally couples this to hw:Loopback,1,0 (capture),
    // which is read by both CAVA and alsaloop.
    output_device = "hw:Loopback,0,0";
    output_rate = "auto";
    output_format = "auto";
};

metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    // Metadata pipe for future TFT album art display
    pipe_name = "/tmp/shairport-sync-metadata";
    pipe_timeout = 5000;
};

// Session hooks — write state to a file that the Python controller monitors.
// The install script patches these paths to the actual install directory.
sessioncontrol = {
    run_this_before_entering_active_state = "/home/pi/Airplaydevice/hooks/on_event.sh connected";
    run_this_after_exiting_active_state = "/home/pi/Airplaydevice/hooks/on_event.sh disconnected";
    run_this_before_play_begins = "/home/pi/Airplaydevice/hooks/on_event.sh playing";
    run_this_after_play_ends = "/home/pi/Airplaydevice/hooks/on_event.sh connected";
    active_state_timeout = 10;
};
