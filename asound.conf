# /etc/asound.conf — ALSA Configuration
# =====================================================================
#
# Audio Pipeline:
#
#   shairport-sync (or bluealsa-aplay)
#        ↓  writes to
#   hw:Loopback,0,0   (ALSA loopback, playback side)
#        ↕  kernel couples playback ↔ capture internally
#   hw:Loopback,1,0   (ALSA loopback, capture side)
#        ↓  shared via dsnoop
#        ├── CAVA           reads for frequency analysis → LED matrix
#        └── alsaloop       relays to softvol_out → DAC → speakers
#
# Why this approach?
#   - The loopback lets us "tap" the audio for visualisation without
#     affecting the playback path.
#   - dsnoop allows CAVA and alsaloop to read simultaneously.
#   - softvol provides volume control because the PCM5102A DAC has
#     no hardware volume mixer.
# =====================================================================


# --- Shared capture from the loopback ---
# dsnoop allows multiple clients (CAVA + alsaloop) to read the same
# capture stream without blocking each other.
pcm.loopcapture {
    type dsnoop
    ipc_key 2048
    slave {
        pcm "hw:Loopback,1,0"
        rate 44100
        period_size 1024
        buffer_size 8192
        channels 2
        format S16_LE
    }
}

# --- Software volume control ---
# The PCM5102A is a fixed-gain DAC with no hardware mixer.
# softvol creates a virtual "SoftMaster" mixer control that we
# adjust with: amixer sset SoftMaster 5%+
pcm.softvol_out {
    type softvol
    slave.pcm "hw:sndrpihifiberry,0"
    control {
        name "SoftMaster"
        card sndrpihifiberry
    }
    min_dB -51.0
    max_dB   0.0
}

# --- Default PCM ---
# Applications that open "default" will write to the loopback.
# (shairport-sync is configured to use hw:Loopback,0,0 explicitly,
#  but this catches anything else.)
pcm.!default {
    type plug
    slave.pcm "hw:Loopback,0,0"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}
