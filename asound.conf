# /etc/asound.conf — Sandy's AirPlay Device (RPi Zero 2 W Production)
# =====================================================================
#
# Audio Pipeline:
#
#   shairport-sync (or bluealsa-aplay)
#        ↓  writes to
#   hw:Loopback,0,0   (ALSA loopback, playback side)
#        ↕  kernel couples playback ↔ capture internally
#   hw:Loopback,1,0   (ALSA loopback, capture side)
#        ↓  shared via dsnoop
#        ├── CAVA           reads for frequency analysis → LED matrix & TFT
#        └── alsaloop       relays to softvol_out → PCM5102A I2S DAC
# =====================================================================

defaults.pcm.rate_converter "speexrate_medium"

# --- Shared capture from the loopback ---
pcm.loopcapture {
    type dsnoop
    ipc_key 2048
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,1,0"
        rate 44100
        period_size 1024
        buffer_size 8192
        channels 2
        format S16_LE
    }
}

# --- Software volume control (PCM5102A I2S DAC) ---
pcm.softvol_out {
    type softvol
    slave.pcm "hw:sndrpihifiberry,0"
    control {
        name "SoftMaster"
        card sndrpihifiberry
    }
    min_dB -51.0
    max_dB   0.0
}

# --- Default PCM ---
pcm.!default {
    type plug
    slave.pcm "hw:Loopback,0,0"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}
