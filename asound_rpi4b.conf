# /etc/asound.conf — Sandy's AirPlay Device (RPi 4B Direct Hardware Hi-Fi Pipeline)
# =================================================================================
# DIRECT HARDWARE ROUTING + KERNEL MULTI-STREAM CLONING (NO ALSALOOP)
#
#   shairport-sync (or bluealsa)
#        ↓ writes stereo audio (44.1kHz S16_LE)
#   pcm.airplay_dup (type plug — auto format / rate conversion)
#        ↓ (resamples smoothly to 48kHz via speexrate_medium)
#   pcm.softvol_master (type softvol — "SoftMaster" volume slider)
#        ↓
#   pcm.duplex_route (type route — splits stereo into 4 channels)
#        ↓
#   pcm.multi_out (type multi — binds physical headphones & loopback)
#        ├── Channels 0 & 1: pcm.dmixer_hw  → bcm2835 Headphones (Direct 3.5mm Jack)
#        └── Channels 2 & 3: pcm.dmixer_loop → hw:Loopback,0,0 (Kernel Loopback)
#                                                    ↕
#                                              hw:Loopback,1,0
#                                                    ↓
#                                              CAVA Visualizer Engine (LED Matrix & TFT)
# =================================================================================

# Use studio-grade Speex resampler for pristine rate adaptation
defaults.pcm.rate_converter "speexrate_medium"

# --- 1. Physical Hardware Output (RPi 4B 3.5mm Headphone Jack) ---
pcm.snd_hw {
    type hw
    card Headphones
    device 0
}

pcm.dmixer_hw {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "snd_hw"
        rate 48000
        period_time 0
        period_size 1024
        buffer_size 8192
        channels 2
    }
    bindings {
        0 0
        1 1
    }
}

# --- 2. Virtual Loopback Output (Feeds CAVA Audio Visualizer) ---
pcm.dmixer_loop {
    type dmix
    ipc_key 2048
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,0,0"
        rate 48000
        period_time 0
        period_size 1024
        buffer_size 8192
        channels 2
    }
    bindings {
        0 0
        1 1
    }
}

# --- 3. Multi Plugin: Bind Physical DAC & Loopback into 4 Channels ---
pcm.multi_out {
    type multi
    slaves {
        a {
            pcm "dmixer_hw"
            channels 2
        }
        b {
            pcm "dmixer_loop"
            channels 2
        }
    }
    bindings {
        0 { slave a; channel 0; }
        1 { slave a; channel 1; }
        2 { slave b; channel 0; }
        3 { slave b; channel 1; }
    }
}

# --- 4. Route Plugin: Duplicate Stereo to Both Outputs ---
pcm.duplex_route {
    type route
    slave.pcm "multi_out"
    ttable.0.0 1.0  # In Left  -> Out 0 (Headphones Left)
    ttable.1.1 1.0  # In Right -> Out 1 (Headphones Right)
    ttable.0.2 1.0  # In Left  -> Out 2 (Loopback Left - CAVA)
    ttable.1.3 1.0  # In Right -> Out 3 (Loopback Right - CAVA)
}

# --- 5. Software Volume Control (SoftMaster) ---
pcm.softvol_master {
    type softvol
    slave.pcm "duplex_route"
    control {
        name "SoftMaster"
        card Headphones
    }
    min_dB -51.0
    max_dB   0.0
}

# --- 6. Master AirPlay Entry Point (Format/Rate Auto-Adaptation) ---
pcm.airplay_dup {
    type plug
    slave.pcm "softvol_master"
}

# --- 7. Loopback Capture for CAVA Visualizer ---
pcm.loopcapture {
    type dsnoop
    ipc_key 3072
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,1,0"
        rate 48000
        period_size 1024
        buffer_size 8192
        channels 2
        format S16_LE
    }
}

# --- Default System Routing ---
pcm.!default {
    type plug
    slave.pcm "airplay_dup"
}

ctl.!default {
    type hw
    card Headphones
}
