# /etc/asound.conf — ALSA Configuration (RPi 4B Prototype)
# =====================================================================
#
# This is the RPi 4B variant that routes audio to the onboard 3.5mm
# headphone jack instead of the I2S DAC (PCM5102A).
#
# When the I2S DAC is connected, switch to the original asound.conf.
#
# Audio Pipeline (unchanged):
#
#   shairport-sync (or bluealsa-aplay)
#        ↓  writes to
#   hw:Loopback,0,0   (ALSA loopback, playback side)
#        ↕  kernel couples playback ↔ capture internally
#   hw:Loopback,1,0   (ALSA loopback, capture side)
#        ↓  shared via dsnoop
#        ├── CAVA           reads for frequency analysis → LED matrix
#        └── alsaloop       relays to softvol_out → Headphones → speakers
# =====================================================================


# --- Shared capture from the loopback ---
# dsnoop allows multiple clients (CAVA + alsaloop) to read the same
# capture stream without blocking each other.
pcm.loopcapture {
    type dsnoop
    ipc_key 2048
    slave {
        pcm "hw:Loopback,1,0"
        rate 44100
        period_size 1024
        buffer_size 8192
        channels 2
        format S16_LE
    }
}

# --- Software volume control ---
# Routes through the RPi 4B's onboard headphone jack.
# The card name "Headphones" is how ALSA exposes the bcm2835 analog output.
# When the I2S DAC arrives, change "Headphones" back to "sndrpihifiberry".
pcm.softvol_out {
    type softvol
    slave.pcm "plughw:Headphones,0"
    control {
        name "SoftMaster"
        card Headphones
    }
    min_dB -51.0
    max_dB   0.0
}

# --- Default PCM ---
# Applications that open "default" will write to the loopback.
# (shairport-sync is configured to use hw:Loopback,0,0 explicitly,
#  but this catches anything else.)
pcm.!default {
    type plug
    slave.pcm "hw:Loopback,0,0"
}

ctl.!default {
    type hw
    card Headphones
}
