# /etc/asound.conf — Sandy's AirPlay Device (RPi 4B Configuration)
# =====================================================================
#
# Audio Pipeline:
#
#   shairport-sync (or bluealsa-aplay)
#        ↓  writes to
#   hw:Loopback,0,0   (ALSA loopback, playback side)
#        ↕  kernel couples playback ↔ capture internally
#   hw:Loopback,1,0   (ALSA loopback, capture side)
#        ↓  shared via dsnoop
#        ├── CAVA           reads for frequency analysis → LED matrix & TFT
#        └── alsaloop       relays to softvol_out → Headphones → 3.5mm jack
# =====================================================================

# Use studio-grade Speex resampler for clean rate adaptation (44.1k -> 48k)
defaults.pcm.rate_converter "speexrate_medium"

# --- Shared capture from the loopback ---
# dsnoop allows multiple clients (CAVA + alsaloop) to read the same
# capture stream without blocking each other.
pcm.loopcapture {
    type dsnoop
    ipc_key 2048
    ipc_perm 0666
    slave {
        pcm "hw:Loopback,1,0"
        rate 44100
        period_size 1024
        buffer_size 8192
        channels 2
        format S16_LE
    }
}

# --- Software volume control (RPi 4B 3.5mm Headphone Jack) ---
# Routes through the RPi 4B's onboard headphone jack via plughw so
# Speex resamples 44.1kHz audio to the BCM2835 native 48kHz cleanly.
pcm.softvol_out {
    type softvol
    slave.pcm "plughw:Headphones,0"
    control {
        name "SoftMaster"
        card Headphones
    }
    min_dB -51.0
    max_dB   0.0
}

# --- Default PCM ---
# Applications that open "default" will write to the loopback.
pcm.!default {
    type plug
    slave.pcm "hw:Loopback,0,0"
}

ctl.!default {
    type hw
    card Headphones
}
